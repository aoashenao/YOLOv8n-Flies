# CG_All_P3P4_v2.yaml
# 去掉P5 backbone + P5检测头（参考LiM-YOLO的Pyramid Level Shift）
# 动机：家蝇13-38px，P5 stride=32，δ_minor=59.4%，P5无效

nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                          # 0  P1/2  → 16ch
  - [-1, 1, Conv, [128, 3, 2]]                         # 1  P2/4  → 32ch
  - [-1, 3, C2f_ContrastGuided, [128, True, 2]]        # 2        → 32ch
  - [-1, 1, Conv, [256, 3, 2]]                         # 3  P3/8  → 64ch
  - [-1, 6, C2f_ContrastGuided, [256, True, 2]]        # 4        → 64ch
  - [-1, 1, Conv, [512, 3, 2]]                         # 5  P4/16 → 128ch
  - [-1, 6, C2f_ContrastGuided, [512, True, 2]]        # 6        → 128ch
  - [-1, 1, SPPF, [512, 5]]
  # 7  SPPF接P4（不再接P5）

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 8
  - [[-1, 4], 1, Concat, [1]]                          # 9   cat P3(layer4)
  - [-1, 3, C2f_ContrastGuided, [256, True, 2]]        # 10  P3融合

  - [-1, 1, Conv, [256, 3, 2]]                         # 11  P3→P4下采样
  - [[-1, 7], 1, Concat, [1]]                          # 12  cat SPPF输出(layer7)
  - [-1, 3, C2f_ContrastGuided, [512, True, 2]]        # 13  P4融合

  - [[10, 13], 1, Detect, [nc]]                        # 14  双尺度检测